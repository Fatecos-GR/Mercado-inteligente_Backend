# ---------------------------------------------------------
# CONFIGURAÇÕES DE BANCO DE DADOS (MYSQL LOCAL)
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/mercadobd?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---------------------------------------------------------
# SEGURANÇA E AUTENTICAÇÃO (JWT)
# ---------------------------------------------------------
api.security.token.secret=${JWT_SECRET}

# ---------------------------------------------------------
# CONFIGURAÇÃO CLOUDINARY (IMAGENS)
# ---------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ---------------------------------------------------------
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ---------------------------------------------------------
spring.application.name=mercado-inteligente
server.port=8080

# ---------------------------------------------------------
# DOCUMENTAÇÃO (SWAGGER / OPENAPI)
# ---------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
